<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0e1014">
  <meta name="color-scheme" content="dark">
  <meta name="description" content="Play and organise M3U / M3U8 IPTV playlists on your iPhone.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="M3U Player">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="css/polish.css">
  <link rel="stylesheet" href="css/desktop.css">
  <title>M3U Player</title>
</head>
<body>
  <div class="chrome">
    <header class="topbar">
      <button id="back" class="icon-btn" aria-label="Back" hidden></button>
      <a id="brand" class="brand" href="#/" aria-label="Home"><span class="brand-mark">▶</span></a>
      <h1 id="title">M3U Player</h1>
      <div id="actions" class="actions"></div>
    </header>
    <section id="player" class="player" hidden>
      <div class="stage">
        <video id="video" playsinline autoplay x-webkit-airplay="allow"></video>
        <div id="ctl" class="ctl" hidden>
          <div class="ctl-top">
            <div class="ctl-info"><div id="ctl-name"></div><div id="ctl-prog" class="muted"></div><span class="bar ctl-pbar"><i id="ctl-pct"></i></span></div>
            <div class="ctl-icons">
              <button data-c="list" aria-label="Channel list"></button><button data-c="mute" aria-label="Mute"></button>
              <button data-c="airplay" aria-label="AirPlay"></button><button data-c="pip" aria-label="Picture in picture"></button>
              <button data-c="full" aria-label="Full screen"></button><button data-c="more" aria-label="More"></button>
            </div>
          </div>
          <div class="ctl-mid"><button data-c="prev" aria-label="Previous channel"></button><button data-c="play" class="ctl-play" aria-label="Play or pause"></button><button data-c="next" aria-label="Next channel"></button></div>
          <div class="ctl-bottom">
            <button data-c="back30" aria-label="Back 30 seconds"></button>
            <input id="ctl-seek" type="range" min="0" max="1000" value="1000" aria-label="Position">
            <span id="ctl-time"></span>
            <button data-c="live" id="ctl-live">LIVE</button>
          </div>
        </div>
        <div id="player-error" class="player-error" hidden></div>
        <div id="tuning" class="tuning" hidden></div>
        <button id="skip-intro" class="skip-intro" hidden>Skip intro</button>
        <div id="next-up" class="next-up" hidden></div>
      </div>
      <div class="player-bar">
        <div class="now">
          <span id="now-logo" class="logo"></span>
          <div class="now-text"><div id="now-name"></div><div id="now-status" class="muted"></div></div>
        </div>
        <button id="now-list" class="icon-btn" aria-label="Channel list"></button>
        <button id="prev" class="icon-btn" aria-label="Previous channel"></button>
        <button id="next" class="icon-btn" aria-label="Next channel"></button>
        <button id="now-more" class="icon-btn" aria-label="Channel options"></button>
        <button id="close" class="icon-btn" aria-label="Close player"></button>
      </div>
      <div id="epg-panel" class="epg-panel" hidden></div>
      <div id="vod-panel" class="vod-panel" hidden></div>
    </section>
  </div>

  <main id="view"></main>

  <div id="sheet-backdrop" hidden></div>
  <div id="sheet" class="sheet" role="dialog" aria-modal="true" hidden></div>
  <div id="toast" class="toast" role="status" hidden></div>

  <script src="vendor/hls.min.js" defer></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
