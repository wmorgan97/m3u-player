<!doctype html><meta charset="utf-8"><title>smoke</title>
<body>
<video id="v" playsinline muted autoplay style="width:320px"></video>
<pre id="log"></pre>
<script src="hls.min.js"></script>
<script type="module">
// Playback smoke test, run headless by tests/smoke.mjs before a deploy is kept. Uses the app's real
// Player and the server's real /hls paths, with public test files (never the IPTV provider).
import { Player } from '../js/player.js';
const key = new URLSearchParams(location.search).get('key') || '';
const log = m => { document.getElementById('log').textContent += m + '\n'; };
const results = [];
const v = document.getElementById('v');
const BBB = 'https://archive.org/download/BigBuckBunny_124/Content/big_buck_bunny_720p_surround.mp4';
const SINTEL = 'https://download.blender.org/durian/trailer/sintel_trailer-720p.mp4';
const hls = (url, extra = '') => `/hls?key=${encodeURIComponent(key)}${extra}&url=${encodeURIComponent(url)}`;
const frames = () => { const q = v.getVideoPlaybackQuality?.(); return q ? q.totalVideoFrames - q.droppedVideoFrames : 0; };
const wait = ms => new Promise(r => setTimeout(r, ms));
async function until(fn, ms) { const end = Date.now() + ms; while (Date.now() < end) { if (fn()) return true; await wait(250); } return false; }
async function test(name, fn) {
  const t0 = Date.now();
  try { await fn(); results.push({ name, ok: true, ms: Date.now() - t0 }); log(`PASS ${name} (${Date.now() - t0}ms)`); }
  catch (e) { results.push({ name, ok: false, error: String(e.message || e) }); log(`FAIL ${name}: ${e.message || e}`); }
}
const assert = (c, m) => { if (!c) throw new Error(m); };

// 1. How the player decides to play things (the bug that broke Chrome VOD).
await test('player picks HLS engine for server streams', async () => {
  const p = new Player(document.createElement('video'));
  const m = p.modes(hls('https://x/series/a/b/1.mkv', '&vod=1'));
  assert(m[0] === 'hlsjs' || m[0] === 'native', `server .mkv stream got ${JSON.stringify(m)}`);
  assert(JSON.stringify(p.modes('https://x/a.mp4')) === '["direct"]', 'plain .mp4 should play directly');
});

const player = new Player(v);
player.transcode = u => hls(u, player.vod ? '&vod=1' : '');

// 2. A film through the VOD pipeline: real length, frames decode, seeking far ahead works.
await test('VOD: starts at 0 with full length, decodes, seeks', async () => {
  player.vod = true;
  const ok = await player.play(BBB);
  assert(ok, 'play() returned false');
  assert(await until(() => frames() > 20 && v.currentTime > 0.5, 25000), `no frames decoded (frames=${frames()})`);
  assert(v.currentTime < 30, `did not start near the beginning (t=${v.currentTime})`);
  assert(Math.abs(v.duration - 596) < 5, `wrong length ${v.duration}`);
  const before = frames();
  v.currentTime = 300;
  assert(await until(() => v.currentTime > 300.5 && frames() > before + 10, 25000), `seek to 300 failed (t=${v.currentTime})`);
});

// 3. The conversion path (HEVC/10-bit files on Chrome) on a public H.264 file, forced.
await test('VOD converted (enc=1): decodes', async () => {
  player.stop();
  player.vod = true;
  player.transcode = u => hls(u, '&vod=1&enc=1');
  assert(await player.play(SINTEL), 'play() returned false');
  assert(await until(() => frames() > 20 && v.currentTime > 0.5, 40000), `no frames (frames=${frames()})`);
});

// 4. The live path (rolling window, starts behind the edge).
await test('live path: decodes', async () => {
  player.stop();
  player.vod = false;
  player.transcode = u => hls(u);
  assert(await player.play(SINTEL), 'play() returned false');
  assert(await until(() => frames() > 20, 30000), `no frames (frames=${frames()})`);
});
player.stop();
for (const u of [BBB, SINTEL]) for (const x of ['&vod=1', '&vod=1&enc=1', '']) fetch(hls(u, x).replace('/hls?', '/hls/stop?')).catch(() => {});
window.__results = results;
window.__done = true;
</script>
