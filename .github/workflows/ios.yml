name: iOS app

# Builds an unsigned .ipa of the native app. Install it with Sideloadly or
# AltStore, which sign it with your own Apple ID (see README → iPhone app).
on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'index.html'
      - 'css/**'
      - 'js/**'
      - 'vendor/**'
      - 'icons/**'
      - 'ios/**'
      - 'capacitor.config.json'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/build-web.js'
      - '.github/workflows/ios.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Use the newest Xcode on the runner
        run: |
          XCODE="$(ls -d /Applications/Xcode_*.app | grep -v beta | sort -V | tail -1)"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Copy the web app into the iOS project
        run: npm run ios:sync

      - name: Build (unsigned)
        run: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            MARKETING_VERSION="1.0.${{ github.run_number }}" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build | tail -n 60
          test -d build/Build/Products/Release-iphoneos/App.app

      - name: Check the app bundle
        run: |
          APP=build/Build/Products/Release-iphoneos/App.app
          ls "$APP" "$APP/Frameworks"
          for f in Frameworks/Capacitor.framework Frameworks/Cordova.framework public/index.html public/js/app.js public/js/native.js public/vendor/hls.min.js capacitor.config.json; do
            test -e "$APP/$f" || { echo "::error::Missing $f in the app bundle"; exit 1; }
          done
          /usr/libexec/PlistBuddy -c 'Print :NSAppTransportSecurity' -c 'Print :UIBackgroundModes' -c 'Print :CFBundleShortVersionString' "$APP/Info.plist"

      - name: Package .ipa
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/App.app Payload/
          zip -qry M3U-Player.ipa Payload
          ls -lh M3U-Player.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: M3U-Player-ipa
          path: M3U-Player.ipa
          retention-days: 30

      - name: Attach to a GitHub release (version tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: M3U-Player.ipa
